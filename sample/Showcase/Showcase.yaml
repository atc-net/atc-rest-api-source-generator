          type: string
          minLength: 1
          maxLength: 100
        state:
          type: [string, "null"]
          maxLength: 100
        postalCode:
          type: string
          minLength: 2
          maxLength: 20
        country:
          type: string
          minLength: 2
          maxLength: 100
