    Users:
      title: Users
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/User"
    UserQuery:
      title: UserQuery
      type: object
      description: |-
        Criteria for the OpenAPI 3.2 QUERY operation on /users. The id set lives in the
        request body precisely because it does not fit in a URL - 1000 GUIDs is roughly
        40 KB of query string against Kestrel's 8 KB request-line limit.
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          description: The user ids to fetch. Unknown ids are ignored rather than erroring.
          items:
            type: string
            format: uuid
    PaginatedResult:
      title: PaginatedResult
      type: object
      properties:
        pageSize:
          type: integer
        pageIndex:
          type: integer
        queryString:
          type: [string, "null"]
        continuation:
          type: [string, "null"]
        count:
          type: integer
        totalCount:
          type: integer
        results:
          type: array
          items: {}
  parameters:
    priceCount:
      name: count
      in: query
      required: false
      description: How many prices to stream before the response ends
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 40
    exchangeClosed:
      name: closed
      in: query
      required: false
      description: Answer as a closed exchange does - 503 with a problem and a Retry-After header
      schema:
        type: boolean
        default: false
    continuation:
      name: continuation
      in: query
      required: false
      schema:
        type: [string, "null"]
    filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
    pageIndex:
      name: pageIndex
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: The number of items to skip before starting to collect the result set.
    pageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: The numbers of items to return.
    queryString:
      name: queryString
      in: query
      required: false
      schema:
        type: [string, "null"]
      description: Search query string.
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication
    oauth2:
      type: oauth2
      description: OAuth2 with Authorization Code flow
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            users:read: Read access to user data
            users:write: Write access to user data
            admin: Full administrative access
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication
x-signalr-hubs:
  notifications:
    url: /hubs/notifications
    events:
      - name: SystemNotification
        payload: '#/components/schemas/SystemNotification'
      - name: UserActivity
        payload: '#/components/schemas/UserActivityEvent'
      - name: DataChange
        payload: '#/components/schemas/DataChangeEvent'
    methods:
      - name: Subscribe
        payload: string[]
        returns: string
      - name: Unsubscribe
        payload: string
