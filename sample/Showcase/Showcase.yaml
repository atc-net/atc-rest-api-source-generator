openapi: "3.2.0"
info:
  version: 1.0.0
  title: My Demo API - Full
  description: This is a sample server for a demo api.
  license:
    name: MIT
servers:
  - url: /api/v1
    description: Api version 1.0

# ============================================
# SECURITY - Global JWT authentication
# ============================================
security:
  - bearer_auth: []

# ============================================
# RATE LIMITING - Global API limits
# ============================================
x-ratelimit-policy: global
x-ratelimit-permit-limit: 1000
x-ratelimit-window-seconds: 60
x-ratelimit-algorithm: sliding

# ============================================
# RESILIENCE - Client-side retry defaults
# ============================================
x-retry-policy: standard
x-retry-max-attempts: 3
x-retry-delay-seconds: 1
x-retry-backoff: exponential
x-retry-use-jitter: true
x-retry-timeout-seconds: 30
x-retry-handle-429: true

# ============================================
# WEBHOOKS - OpenAPI 3.1 feature
# Defines event payloads sent to subscribers
# ============================================
webhooks:
  systemNotification:
    post:
      operationId: onSystemNotification
      summary: System notification webhook
      description: |
        Webhook triggered for system-wide notifications.
        Events are sent every 10 seconds with system metrics and alerts.
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemNotification'
      responses:
        '200':
          description: Notification acknowledged
        '202':
          description: Notification accepted for processing

  userActivity:
    post:
      operationId: onUserActivity
      summary: User activity webhook
      description: |
        Webhook triggered when user activity occurs (login, logout, profile update).
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActivityEvent'
      responses:
        '200':
          description: Event acknowledged

  dataChange:
    post:
      operationId: onDataChange
      summary: Data change webhook
      description: |
        Webhook triggered when data is created, updated, or deleted.
        Subscribers receive real-time updates about entity changes.
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataChangeEvent'
      responses:
        '200':
          description: Event acknowledged

paths:
  /accounts:
    # Path-level rate limiting - moderate limits for account operations
    x-ratelimit-policy: accounts
    x-ratelimit-permit-limit: 100
    x-ratelimit-window-seconds: 60
    # Partition per authenticated user, keyed by the "oid" claim
    x-ratelimit-partition: user
    x-ratelimit-partition-claim: oid
    # Path-level resilience - fast retry for account operations
    x-retry-policy: accounts-fast
    x-retry-max-attempts: 2
    x-retry-delay-seconds: 0.5
    x-retry-timeout-seconds: 10
    # Output Caching - endpoint-level caching with .CacheOutput()
    x-cache-type: output
    x-cache-policy: accounts
    x-cache-expiration-seconds: 60
    # The account list is the same for every caller, and every caller is signed in (the root security): without
    # x-cache-shared the output cache's default policy never caches an authenticated request - see ATC_API_CACHE002.
    # The handlers that change an account evict the cached lists by their tag.
    x-cache-shared: true
    x-cache-vary-by-query:
      - limit
    x-cache-tags:
      - accounts
    get:
      summary: List all accounts
      operationId: listAccounts
      tags:
        - accounts
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: Array of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accounts"
    post:
      summary: Create account
      operationId: createAccount
      tags:
        - accounts
      # Disable retry for non-idempotent POST
      x-retry-enabled: false
      # Opt out of the path-level output cache. The ASP.NET Core output-cache middleware
      # stores GET/HEAD responses only, so inheriting it here would emit a .CacheOutput(...)
      # call that never caches - see ATC_API_CACHE001.
      x-cache-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        '409':
          description: Account conflict
  /accounts/{accountId}:
    # Inherit accounts policy
    x-ratelimit-policy: accounts
    # Partition per authenticated user, keyed by the "oid" claim (must match /accounts above)
    x-ratelimit-partition: user
    x-ratelimit-partition-claim: oid
    x-retry-policy: accounts-fast
    get:
      summary: Get a specific account
      operationId: getAccountById
      tags:
        - accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: The id of the account to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        '404':
          description: Account not found
    delete:
      summary: Delete a specific account
      operationId: deleteAccountById
      x-audit: true
      tags:
        - accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: The id of the account to delete
          schema:
            type: string
      responses:
        '204':
          description: Account deleted successfully
        '404':
          description: Account not found
    put:
      summary: Update a specific account
      operationId: updateAccountById
      tags:
        - accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: The id of the account to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        '404':
          description: Account not found
  /accounts/paginated:
    get:
      summary: List all accounts paginated
      operationId: listPaginatedAccounts
      tags:
        - accounts
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/pageIndex'
        - $ref: '#/components/parameters/queryString'
        - $ref: '#/components/parameters/continuation'
      responses:
        '200':
          description: Array of paginated accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResult'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Accounts'
  /accounts/async-enumerable:
    get:
      summary: List all accounts async-enumerable
      operationId: listAsyncEnumerableAccounts
      tags:
        - accounts
      x-return-async-enumerable: true
      responses:
        '200':
          description: Array of streaming accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accounts"
  /tasks:
    get:
      summary: List all tasks
      operationId: listTasks
      tags:
        - tasks
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: Array of tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tasks"
    post:
      summary: Create task
      operationId: createTask
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Task"
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        '409':
          description: Task conflict
  /tasks/{taskId}:
    get:
      summary: Get a specific task
      operationId: getTaskById
      tags:
        - tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: The id of the task to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        '404':
          description: Task not found
    delete:
      summary: Delete a specific task
      operationId: deleteTaskById
      x-audit: true
      tags:
        - tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: The id of the task to delete
          schema:
            type: string
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
    put:
      summary: Update a specific task
      operationId: updateTaskById
      tags:
        - tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: The id of the task to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Task"
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        '404':
          description: Task not found
  /users:
    # Path-level rate limiting - stricter limits for user operations
    x-ratelimit-policy: users
    x-ratelimit-permit-limit: 50
    x-ratelimit-window-seconds: 60
    x-ratelimit-algorithm: fixed
    # Partition by caller IP
    x-ratelimit-partition: ip
    # Path-level resilience
    x-retry-policy: users
    x-retry-max-attempts: 3
    x-retry-delay-seconds: 1
    # HybridCache - handler-level caching for complex user scenarios
    x-cache-type: hybrid
    x-cache-policy: users
    x-cache-expiration-seconds: 300
    x-cache-mode: hybrid
    x-cache-vary-by-query:
      - search
      - country
      - role
      - isActive
      - limit
    x-cache-tags:
      - users
    get:
      summary: List all users
      operationId: listUsers
      tags:
        - users
      parameters:
        - name: search
          in: query
          description: Search by name or email
          required: false
          schema:
            type: string
        - name: country
          in: query
          description: Filter by country
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: Filter by role (Admin, Manager, Employee, Guest)
          required: false
          schema:
            type: string
            enum:
              - Admin
              - Manager
              - Employee
              - Guest
        - name: isActive
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Array of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
    # OpenAPI 3.2 QUERY - a read whose criteria are too large for a URL.
    #
    # Looking up 1000 users by id as a GET would serialize to roughly 40 KB of query
    # string ("id=" plus a 36-character GUID, a thousand times over). Kestrel's default
    # MaxRequestLineSize is 8 KB, so that request is rejected with 414 URI Too Long
    # before it ever reaches a handler - and proxies and CDNs impose their own, often
    # lower, limits. QUERY is safe and idempotent like GET, but the criteria travel in
    # a request body, so there is no URL to outgrow.
    query:
      summary: Query users by a set of ids
      description: |-
        Fetches users by an explicit set of ids. Use this instead of `GET /users` with
        repeated `id` query parameters when the set is large - see ATC_API_OPR027.
      operationId: queryUsers
      tags:
        - users
      # QUERY is a read, but the output-cache middleware stores GET/HEAD only and keys on
      # the URL - which cannot distinguish two bodies. The path-level config here is
      # x-cache-type: hybrid, which caches inside the handler, so it applies correctly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserQuery"
      responses:
        '200':
          description: Array of matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        '400':
          description: Validation error
    post:
      summary: Create user
      operationId: createUser
      tags:
        - users
      # Admin-only operation with OAuth2 scopes
      security:
        - oauth2: ["users:write", "admin"]
      # Disable retry for non-idempotent POST
      x-retry-enabled: false
      # Disable caching for write operations
      x-cache-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Validation error
        '409':
          description: User with this email already exists
  /users/import:
    post:
      summary: Import users - a list as JSON or XML
      description: |-
        Creates every user of the list. The list is accepted as JSON or as XML (`<users><user>...</user></users>`):
        the generated server binds it by its Content-Type, and the validation filter checks every item.
      operationId: importUsers
      tags:
        - users
      security:
        - oauth2: ["users:write", "admin"]
      x-retry-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/CreateUserRequest"
          application/xml:
            schema:
              type: array
              maxItems: 100
              xml:
                name: users
              items:
                $ref: "#/components/schemas/CreateUserRequest"
      responses:
        '200':
          description: The imported users (an existing email is the existing user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        '400':
          description: Validation error
  /users/{userId}:
    # Inherit users policy
    x-ratelimit-policy: users
    # Partition by caller IP (must match /users above)
    x-ratelimit-partition: ip
    x-retry-policy: users
    # HybridCache - specific policy for user detail with sliding expiration
    x-cache-type: hybrid
    x-cache-policy: user-detail
    x-cache-expiration-seconds: 600
    x-cache-sliding-expiration-seconds: 120
    x-cache-mode: hybrid
    x-cache-tags:
      - users
      - user-detail
    parameters:
      - name: userId
        in: path
        required: true
        description: The id of the user
        schema:
          type: string
          format: uuid
    get:
      summary: Get a specific user
      operationId: getUserById
      tags:
        - users
      responses:
        '200':
          description: User details - as JSON, or as XML when the Accept header asks for it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
        '404':
          description: User not found
    put:
      summary: Update a specific user
      operationId: updateUserById
      tags:
        - users
      # Disable caching for write operations
      x-cache-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Validation error
        '404':
          description: User not found
        '409':
          description: Email already in use
    delete:
      summary: Delete a specific user
      operationId: deleteUserById
      x-audit: true
      tags:
        - users
      # Admin-only operation
      security:
        - oauth2: ["users:write", "admin"]
      # Stricter rate limit for deletes
      x-ratelimit-policy: users-delete
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      # Disable caching for write operations
      x-cache-enabled: false
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
  /files/{id}:
    # Files - extended timeout for large files
    x-ratelimit-policy: files
    x-ratelimit-permit-limit: 30
    x-ratelimit-window-seconds: 60
    x-retry-policy: files
    x-retry-max-attempts: 3
    x-retry-delay-seconds: 2
    x-retry-timeout-seconds: 120
    parameters:
      - name: id
        in: path
        description: The file id
        required: true
        schema:
          type: string
    get:
      operationId: getFileById
      summary: Get File By Id
      description: Get File By Id
      tags: []
      # Public endpoint - no auth required for file downloads
      security: []
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers: {}
        '404':
          description: Not Found
  /files/form-data/singleObject:
    # File uploads - strict rate limits, no retry
    x-ratelimit-policy: file-uploads
    x-ratelimit-permit-limit: 10
    x-ratelimit-window-seconds: 60
    x-ratelimit-algorithm: token-bucket
    x-ratelimit-queue-limit: 5
    post:
      operationId: uploadSingleObjectWithFileAsFormData
      summary: Upload a file as FormData
      description: Upload a file as FormData
      # No retry for file uploads - extended timeout instead
      x-retry-enabled: false
      x-retry-timeout-seconds: 300
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileAsFormDataRequest'
            # The metadata is a URL-encoded part (author=Ada&confidential=true): a model whose properties are each one
            # value. Without an encoding it would be an application/json part
            encoding:
              metadata:
                contentType: application/x-www-form-urlencoded
    parameters: []
  /files/form-data/singleObjectMultiFile:
    # Inherit file-uploads policy
    x-ratelimit-policy: file-uploads
    post:
      operationId: uploadSingleObjectWithFilesAsFormData
      summary: Upload files as FormData
      description: Upload files as FormData
      # No retry for file uploads
      x-retry-enabled: false
      x-retry-timeout-seconds: 300
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FilesAsFormDataRequest'
    parameters: []
  /files/form-data/singleFile:
    # Inherit file-uploads policy
    x-ratelimit-policy: file-uploads
    post:
      operationId: uploadSingleFileAsFormData
      summary: Upload a file as OctetStream
      description: Upload a file as OctetStream
      # No retry for file uploads
      x-retry-enabled: false
      x-retry-timeout-seconds: 300
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
    parameters: []
  /files/form-data/multiFile:
    # Inherit file-uploads policy
    x-ratelimit-policy: file-uploads
    post:
      summary: Upload multi files as form data
      description: Upload multi files as form data
      operationId: uploadMultiFilesAsFormData
      # No retry for file uploads
      x-retry-enabled: false
      x-retry-timeout-seconds: 300
      responses:
        '200':
          description: OK
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: array
              items:
                type: string
                format: binary

  # ============================================
  # DOCUMENTS - PDF, Excel, PNG and JPEG as raw bodies
  # ============================================
  /documents:
    # Its own limits: the documents page uploads and downloads a lot
    x-ratelimit-policy: documents
    x-ratelimit-permit-limit: 200
    x-ratelimit-window-seconds: 60
    get:
      operationId: listDocuments
      summary: List the uploaded documents
      tags:
        - documents
      responses:
        '200':
          description: The documents, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      summary: Upload a document - a PDF, an Excel workbook, a PNG or a JPEG - as the raw request body
      description: >
        The request body is the file itself, sent with its own media type. The handler gets the type that arrived
        (the generated parameters carry it, as the upload declares several).
      tags:
        - documents
      x-retry-enabled: false
      parameters:
        - name: fileName
          in: query
          required: true
          description: The document's file name
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The stored document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        '400':
          description: Bad Request
  /documents/{documentId}:
    x-ratelimit-policy: documents
    parameters:
      - name: documentId
        in: path
        required: true
        description: The document id
        schema:
          type: string
          format: uuid
    get:
      operationId: getDocument
      summary: Download a document - with its own media type and file name
      tags:
        - documents
      responses:
        '200':
          description: The document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found
  /documents/{documentId}/summary:
    x-ratelimit-policy: documents
    parameters:
      - name: documentId
        in: path
        required: true
        description: The document id
        schema:
          type: string
          format: uuid
    get:
      operationId: getDocumentSummary
      summary: A document's summary - as JSON, or as a printable PDF
      description: >
        A model or a file: the summary as JSON, or (printable) the same summary as a PDF. The client reads either,
        told apart by the response's Content-Type.
      tags:
        - documents
      parameters:
        - name: printable
          in: query
          required: false
          description: Answer the summary as a PDF
          schema:
            type: boolean
            default: false
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of a summary read earlier - unchanged, the answer is 304 Not Modified
          schema:
            type: string
      responses:
        '200':
          description: The summary, or the summary as a PDF
          headers:
            ETag:
              description: The summary's version - send it back as If-None-Match
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
            application/pdf:
              schema:
                type: string
                format: binary
        '304':
          description: The summary has not changed since the ETag sent as If-None-Match
          headers:
            ETag:
              description: The summary's version, unchanged
              schema:
                type: string
        '404':
          description: Document not found

  # 303 See Other: the copy is made, and the client is sent to read it (post / redirect / get)
  /documents/{documentId}/copy:
    x-ratelimit-policy: documents
    parameters:
      - name: documentId
        in: path
        required: true
        description: The document id
        schema:
          type: string
          format: uuid
    post:
      operationId: copyDocument
      summary: Copy a document - answered with 303 See Other to the copy's summary
      description: >
        Makes a copy of the document and answers 303 See Other with the copy's summary as the Location; a client that
        follows redirects (browsers, HttpClient) reads the summary with a GET.
      tags:
        - documents
      x-retry-enabled: false
      responses:
        '303':
          description: The copy was made; its summary is at the Location
          headers:
            Location:
              description: The copy's summary
              schema:
                type: string
                format: uri
        '404':
          description: Document not found

  # ============================================
  # NOTIFICATIONS - Subscription management
  # ============================================
  /notifications/subscriptions:
    get:
      summary: List all notification subscriptions
      operationId: listSubscriptions
      tags:
        - notifications
      responses:
        '200':
          description: List of active subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriptions'
    post:
      summary: Create a new subscription
      operationId: createSubscription
      tags:
        - notifications
      description: |
        Subscribe to receive notifications for specific event types.
        For web clients, use the SignalR hub at /hubs/notifications instead of HTTP callbacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid subscription request
        '409':
          description: Subscription already exists for this topic

  /notifications/subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The subscription ID
    get:
      summary: Get subscription details
      operationId: getSubscriptionById
      tags:
        - notifications
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: Subscription not found
    delete:
      summary: Cancel a subscription
      operationId: deleteSubscription
      x-audit: true
      tags:
        - notifications
      responses:
        '204':
          description: Subscription cancelled
        '404':
          description: Subscription not found

  /notifications/stream:
    get:
      summary: Stream notifications in real-time
      operationId: listNotifications
      tags:
        - notifications
      description: |
        The notifications as they happen, as one streamed JSON array (application/json): every client reads it
        item by item, and the response ends when the client stops reading. For Server-Sent Events see the
        /streams/prices operations; for pushing to many clients see the notifications hub (x-signalr-hubs).
      x-return-async-enumerable: true
      parameters:
        - name: topics
          in: query
          description: Comma-separated list of topics to subscribe to
          required: false
          schema:
            type: string
            default: system,user,data
      responses:
        '200':
          description: Stream of notification events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEvents'

  # ============================================
  # STREAMS - the same prices in each of the five stream formats
  # ============================================
  /streams/prices/events:
    # No retry: the page shows the 503 of a closed exchange as it is answered, not after the retries
    x-retry-enabled: false
    get:
      summary: Live prices as Server-Sent Events
      operationId: listPriceEvents
      tags:
        - streams
      description: |
        One price at a time, as the server has it - the response is Server-Sent Events (text/event-stream).
        Every format carries the same items; the generated clients read all five the same way.
        Every event has an id (the price's sequence number): a client whose stream dropped sends the last id it
        read as Last-Event-ID, and the stream goes on after it.
      x-return-async-enumerable: true
      parameters:
        - $ref: '#/components/parameters/priceCount'
        - $ref: '#/components/parameters/exchangeClosed'
        - name: dropAfter
          in: query
          required: false
          description: Drop the connection after this many events - to show a resume. Not applied to a resumed stream
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event read - the stream goes on after it
          schema:
            type: string
      responses:
        '200':
          description: The prices, one at a time
          headers:
            X-Stream-Format:
              description: The format the prices are streamed in
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PriceTick'
        '503':
          description: The exchange is closed
          headers:
            Retry-After:
              description: Seconds until the exchange opens
              schema:
                type: integer
                format: int32

  /streams/prices/live:
    # No retry: a live stream is not sent again from the start
    x-retry-enabled: false
    get:
      summary: The live price feed as Server-Sent Events
      operationId: listLivePriceEvents
      tags:
        - streams
      description: |
        The one live feed every subscriber shares - what a long-lived event stream needs besides its items.
        Every event's id is the price's sequence: a client that sends the last id it read as Last-Event-ID gets
        the prices after it from a buffer of the latest ones (X-Events-Missed says how many the buffer no longer
        had), then the live ones. When no price comes for heartbeatSeconds, a named event "ping" - which the
        clients read past - keeps a proxy from closing the idle connection. A subscriber that falls behind is cut
        off (and resumes), so it never holds up the feed.
      x-return-async-enumerable: true
      parameters:
        - name: heartbeatSeconds
          in: query
          required: false
          description: Seconds without a price before a ping event (15 when left out)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 60
        - name: count
          in: query
          required: false
          description: End the stream after this many prices (left out, it does not end)
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event read - the stream goes on after it
          schema:
            type: string
      responses:
        '200':
          description: The live prices, one at a time
          headers:
            X-Events-Missed:
              description: How many prices after Last-Event-ID the buffer no longer had (0 when it had them all)
              schema:
                type: integer
                format: int64
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PriceTick'

  /streams/prices/import:
    post:
      summary: Import prices sent as JSON Lines
      operationId: importPrices
      tags:
        - streams
      description: |
        The prices are sent as JSON Lines (application/jsonl): one price per line, written by the client as it has
        them, read by the handler one at a time - an import of any size takes the memory of one price. Each price is
        validated as it arrives: the first one that is not valid stops the import with a 400 that names it
        ([3].price).
      requestBody:
        required: true
        content:
          application/jsonl:
            schema:
              $ref: '#/components/schemas/PriceTick'
      responses:
        '200':
          description: What was imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceImportSummary'
        '400':
          description: A price is not valid

  /streams/prices/lines:
    # No retry: the page shows the 503 of a closed exchange as it is answered, not after the retries
    x-retry-enabled: false
    get:
      summary: Live prices as JSON Lines
      operationId: listPriceLines
      tags:
        - streams
      description: |
        One price at a time, as the server has it - the response is JSON Lines (application/jsonl).
        Every format carries the same items; the generated clients read all five the same way.
      x-return-async-enumerable: true
      parameters:
        - $ref: '#/components/parameters/priceCount'
        - $ref: '#/components/parameters/exchangeClosed'
      responses:
        '200':
          description: The prices, one at a time
          headers:
            X-Stream-Format:
              description: The format the prices are streamed in
              schema:
                type: string
          content:
            application/jsonl:
              schema:
                $ref: '#/components/schemas/PriceTick'
        '503':
          description: The exchange is closed
          headers:
            Retry-After:
              description: Seconds until the exchange opens
              schema:
                type: integer
                format: int32

  /streams/prices/array:
    # No retry: the page shows the 503 of a closed exchange as it is answered, not after the retries
    x-retry-enabled: false
    get:
      summary: Live prices as a JSON array
      operationId: listPriceElements
      tags:
        - streams
      description: |
        One price at a time, as the server has it - the response is a JSON array (application/json).
        Every format carries the same items; the generated clients read all five the same way.
      x-return-async-enumerable: true
      parameters:
        - $ref: '#/components/parameters/priceCount'
        - $ref: '#/components/parameters/exchangeClosed'
      responses:
        '200':
          description: The prices, one at a time
          headers:
            X-Stream-Format:
              description: The format the prices are streamed in
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceTick'
        '503':
          description: The exchange is closed
          headers:
            Retry-After:
              description: Seconds until the exchange opens
              schema:
                type: integer
                format: int32

  /streams/prices/sequence:
    # No retry: the page shows the 503 of a closed exchange as it is answered, not after the retries
    x-retry-enabled: false
    get:
      summary: Live prices as a JSON Text Sequence (RFC 7464)
      operationId: listPriceRecords
      tags:
        - streams
      description: |
        One price at a time, as the server has it - the response is a JSON Text Sequence (RFC 7464) (application/json-seq).
        Every format carries the same items; the generated clients read all five the same way.
      x-return-async-enumerable: true
      parameters:
        - $ref: '#/components/parameters/priceCount'
        - $ref: '#/components/parameters/exchangeClosed'
      responses:
        '200':
          description: The prices, one at a time
          headers:
            X-Stream-Format:
              description: The format the prices are streamed in
              schema:
                type: string
          content:
            application/json-seq:
              schema:
                $ref: '#/components/schemas/PriceTick'
        '503':
          description: The exchange is closed
          headers:
            Retry-After:
              description: Seconds until the exchange opens
              schema:
                type: integer
                format: int32

  /streams/prices/parts:
    # No retry: the page shows the 503 of a closed exchange as it is answered, not after the retries
    x-retry-enabled: false
    get:
      summary: Live prices as multipart/mixed
      operationId: listPriceParts
      tags:
        - streams
      description: |
        One price at a time, as the server has it - the response is multipart/mixed (multipart/mixed).
        Every format carries the same items; the generated clients read all five the same way.
      x-return-async-enumerable: true
      parameters:
        - $ref: '#/components/parameters/priceCount'
        - $ref: '#/components/parameters/exchangeClosed'
      responses:
        '200':
          description: The prices, one at a time
          headers:
            X-Stream-Format:
              description: The format the prices are streamed in
              schema:
                type: string
          content:
            multipart/mixed:
              schema:
                $ref: '#/components/schemas/PriceTick'
        '503':
          description: The exchange is closed
          headers:
            Retry-After:
              description: Seconds until the exchange opens
              schema:
                type: integer
                format: int32

  # ============================================
  # TESTING - Exception handling test endpoints
  # ============================================
  /testing/exception/{code}:
    # Disable retry for testing - we want to see actual error responses, not retries
    x-retry-enabled: false
    get:
      summary: Test exception handling
      description: |
        Throws different exceptions based on the code parameter to test GlobalErrorHandlingMiddleware.

        Supported codes:
        - 0: Success (no exception)
        - 1: General Exception → 500 Internal Server Error
        - 2: ArgumentException → 400 Bad Request
        - 3: ArgumentNullException → 500 Internal Server Error (a server-side bug, not a bad request)
        - 4: InvalidOperationException → 500 Internal Server Error (map it to 409 with MapException if you throw it on purpose)
        - 5: UnauthorizedAccessException → 500 Internal Server Error
        - 6: NotImplementedException → 501 Not Implemented
        - 7: TimeoutException → 504 Gateway Timeout
        - 8: ValidationException (DataAnnotations) → 400 Bad Request
        - 9: KeyNotFoundException → 500 Internal Server Error (default)
        - 10: NullReferenceException → 500 Internal Server Error
        - 11: TaskCanceledException → 504 Gateway Timeout
      operationId: getExceptionTest
      tags:
        - testing
      # Public endpoint - no auth required for testing
      security: []
      parameters:
        - name: code
          in: path
          required: true
          description: |
            The exception code to throw (0-11).
            Code 0 returns success, other codes throw specific exceptions.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 11
      responses:
        '200':
          description: Success response (when code is 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionTestResponse"
        '404':
          description: Not Found (invalid code)

  /testing/error-responses/{status}:
    # Disable retry for testing - we want to see actual error responses, not retries
    x-retry-enabled: false
    post:
      summary: Test error responses
      description: |
        Returns the requested error status through the generated result factories, to show the error
        contract: every error a handler returns is an RFC 9457 ProblemDetails (`application/problem+json`),
        unless the specification declares another body for that status.

        Supported statuses: 400, 404, 409, 422 and 429 (with `Retry-After`); any other value returns 204.
      operationId: getErrorResponseTest
      tags:
        - testing
      # Public endpoint - no auth required for testing
      security: []
      parameters:
        - name: status
          in: path
          required: true
          description: The error status to return (400, 404, 409, 422 or 429).
          schema:
            type: integer
            format: int32
        - name: reason
          in: query
          required: false
          description: With 400, a refusal that is no field error - written as the problem's detail instead of field errors.
          schema:
            type: string
      responses:
        '204':
          description: No error requested
        '400':
          description: Bad Request (a validation problem)
        '404':
          description: Not Found
        '409':
          description: Conflict
        '422':
          description: Unprocessable Entity
        '429':
          description: Too Many Requests (with Retry-After)

  /testing/declared-bad-request:
    # Disable retry for testing - we want to see actual error responses, not retries
    x-retry-enabled: false
    post:
      summary: Test a declared 400 model
      description: |
        Declares its own 400 body (`TestingProblem`, a problem without field errors). A request body that breaks
        its rules is rejected by the generated ValidationFilter with a ValidationProblemDetails; the name "taken"
        is rejected by the handler with a `TestingProblem`. The C# EndpointPerOperation client reads both as the
        declared `TestingProblem` (`BadRequestContent`) and gives the ValidationFilter's field errors through
        `BadRequestValidationErrors`.
      operationId: postDeclaredBadRequestTest
      tags:
        - testing
      # Public endpoint - no auth required for testing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclaredBadRequestTestRequest"
      responses:
        '204':
          description: The request was valid
        '400':
          description: Bad Request - the declared model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestingProblem"

  /testing/enum-wire:
    x-retry-enabled: false
    post:
      summary: Echo a string enum
      description: |
        Answers the body as the server read it. The server marker sets `readEnumMemberNames`, so the enum is read by
        its value (`DARK_BLUE`) and by its C# member name (`DarkBlue`) - what a client built on 2.x sent; the answer
        has the value, as the specification writes it.
      operationId: echoEnumWire
      tags:
        - testing
      # Public endpoint - no auth required for testing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnumWire"
      responses:
        '200':
          description: The body as the server read it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnumWire"
        '400':
          description: Bad Request - a value that is no value of Shade
components:
  schemas:
    EnumWire:
      title: EnumWire
      type: object
      description: A body with a string enum whose values are not its member names
      required:
        - shade
      properties:
        shade:
          $ref: "#/components/schemas/Shade"
    Shade:
      type: string
      description: A shade - on the wire as LIGHT or DARK_BLUE (the C# member of DARK_BLUE is DarkBlue)
      enum:
        - LIGHT
        - DARK_BLUE
    PriceTick:
      title: PriceTick
      type: object
      description: One price of one symbol
      required:
        - symbol
        - price
        - change
        - sequence
      properties:
        symbol:
          type: string
          minLength: 1
        price:
          type: number
          format: double
          minimum: 0
        change:
          type: number
          format: double
        sequence:
          type: integer
          format: int64
    PriceImportSummary:
      title: PriceImportSummary
      type: object
      description: What an import of prices read
      required:
        - count
        - symbols
        - lowest
        - highest
      properties:
        count:
          type: integer
          format: int32
          description: The prices read
        symbols:
          type: array
          description: The symbols, each once, in the order they first came
          items:
            type: string
        lowest:
          type: number
          format: double
        highest:
          type: number
          format: double
    Document:
      title: Document
      type: object
      required:
        - id
        - fileName
        - contentType
        - length
        - sha256
        - uploadedAt
      properties:
        id:
          type: string
          format: uuid
          description: The document id
        fileName:
          type: string
          description: The file name it was uploaded with
        contentType:
          type: string
          description: The media type it arrived as
        length:
          type: integer
          format: int64
          description: Its length in bytes
        sha256:
          type: string
          description: The SHA-256 of its bytes, as hex
        uploadedAt:
          type: string
          format: date-time
          description: When it was uploaded
    DocumentSummary:
      title: DocumentSummary
      type: object
      required:
        - id
        - fileName
        - kind
        - contentType
        - length
        - sha256
      properties:
        id:
          type: string
          format: uuid
          description: The document id
        fileName:
          type: string
          description: The file name
        kind:
          type: string
          description: What kind of document it is (pdf, spreadsheet, image)
        contentType:
          type: string
          description: Its media type
        length:
          type: integer
          format: int64
          description: Its length in bytes
        sha256:
          type: string
          description: The SHA-256 of its bytes, as hex
    # ============================================
    # WEBHOOK PAYLOADS - Event schemas
    # ============================================
    SystemNotification:
      title: SystemNotification
      type: object
      description: System-wide notification event
      required:
        - id
        - type
        - timestamp
        - message
      properties:
        id:
          type: string
          format: uuid
          description: Unique notification ID
        type:
          $ref: '#/components/schemas/NotificationType'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        message:
          type: string
          description: Human-readable notification message
        data:
          type: [string, "null"]
          description: Additional event-specific data as JSON string
        metrics:
          $ref: '#/components/schemas/SystemMetrics'

    SystemMetrics:
      title: SystemMetrics
      type: object
      description: Real-time system metrics
      properties:
        cpuUsage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: CPU usage percentage
        memoryUsage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Memory usage percentage
        activeConnections:
          type: integer
          minimum: 0
          description: Number of active connections
        requestsPerSecond:
          type: number
          format: double
          minimum: 0
          description: Current requests per second
        averageResponseTime:
          type: number
          format: double
          minimum: 0
          description: Average response time in milliseconds
        uptime:
          type: string
          description: System uptime duration (e.g., "2d 5h 30m")

    UserActivityEvent:
      title: UserActivityEvent
      type: object
      description: User activity webhook payload
      required:
        - id
        - userId
        - action
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/UserAction'
        timestamp:
          type: string
          format: date-time
        ipAddress:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        details:
          type: [string, "null"]
          description: Additional details as JSON string

    UserAction:
      type: string
      enum:
        - Login
        - Logout
        - ProfileUpdate
        - PasswordChange
        - AccountCreated
        - AccountDeleted
      description: Type of user action

    DataChangeEvent:
      title: DataChangeEvent
      type: object
      description: Data change webhook payload
      required:
        - id
        - entityType
        - entityId
        - operation
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
          description: Type of entity (e.g., "User", "Account", "Task")
        entityId:
          type: string
          description: ID of the affected entity
        operation:
          $ref: '#/components/schemas/DataOperation'
        timestamp:
          type: string
          format: date-time
        performedBy:
          type: [string, "null"]
          format: uuid
          description: User who performed the operation
        previousValue:
          type: [string, "null"]
          description: Previous entity state as JSON string (for updates)
        newValue:
          type: [string, "null"]
          description: New entity state as JSON string (for creates/updates)

    DataOperation:
      type: string
      enum:
        - Created
        - Updated
        - Deleted
      description: Type of data operation

    NotificationType:
      type: string
      enum:
        - System
        - User
        - Data
        - Alert
        - Metric
      description: Category of notification

    NotificationSeverity:
      type: string
      enum:
        - Info
        - Warning
        - Error
        - Critical
      description: Severity level of the notification

    # ============================================
    # SUBSCRIPTION MANAGEMENT
    # ============================================
    Subscription:
      title: Subscription
      type: object
      description: Notification subscription
      required:
        - id
        - topics
        - createdAt
        - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: [string, "null"]
          maxLength: 100
          description: Optional friendly name for the subscription
        topics:
          type: array
          items:
            $ref: '#/components/schemas/NotificationType'
          minItems: 1
          description: Event types to subscribe to
        callbackUrl:
          type: [string, "null"]
          format: uri
          description: HTTP callback URL for webhook delivery (optional)
        connectionId:
          type: [string, "null"]
          description: SignalR connection ID for real-time delivery
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Optional expiration time
        lastNotificationAt:
          type: [string, "null"]
          format: date-time

    Subscriptions:
      title: Subscriptions
      type: array
      items:
        $ref: '#/components/schemas/Subscription'

    CreateSubscriptionRequest:
      title: CreateSubscriptionRequest
      type: object
      required:
        - topics
      properties:
        name:
          type: [string, "null"]
          maxLength: 100
        topics:
          type: array
          items:
            $ref: '#/components/schemas/NotificationType'
          minItems: 1
          description: Event types to subscribe to
        callbackUrl:
          type: [string, "null"]
          format: uri
          description: HTTP callback URL (use for server-to-server webhooks)
        expiresInMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 43200
          description: Subscription duration in minutes (max 30 days)

    NotificationEvent:
      title: NotificationEvent
      type: object
      description: Generic notification event for streaming
      required:
        - id
        - type
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        timestamp:
          type: string
          format: date-time
        message:
          type: [string, "null"]
        payload:
          oneOf:
            - $ref: '#/components/schemas/SystemNotification'
            - $ref: '#/components/schemas/UserActivityEvent'
            - $ref: '#/components/schemas/DataChangeEvent'

    NotificationEvents:
      title: NotificationEvents
      type: array
      items:
        $ref: '#/components/schemas/NotificationEvent'

    # ============================================
    # EXISTING SCHEMAS
    # ============================================
    ExceptionTestResponse:
      title: ExceptionTestResponse
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: integer
          format: int32
          description: The exception code that was requested
        message:
          type: string
          description: Success message when no exception was thrown
        timestamp:
          type: string
          format: date-time
          description: When the request was processed
    DeclaredBadRequestTestRequest:
