openapi: "3.1.0"
paths:
  /users:
    # Path-level rate limiting - stricter limits for user operations
    x-ratelimit-policy: users
    x-ratelimit-permit-limit: 50
    x-ratelimit-window-seconds: 60
    x-ratelimit-algorithm: fixed
    # Path-level resilience
    x-retry-policy: users
    x-retry-max-attempts: 3
    x-retry-delay-seconds: 1
    # HybridCache - handler-level caching for complex user scenarios
    x-cache-type: hybrid
    x-cache-policy: users
    x-cache-expiration-seconds: 300
    x-cache-mode: hybrid
    x-cache-vary-by-query:
      - search
      - country
      - role
      - isActive
      - limit
    x-cache-tags:
      - users
    get:
      summary: List all users
      operationId: listUsers
      tags:
        - users
      parameters:
        - name: search
          in: query
          description: Search by name or email
          required: false
          schema:
            type: string
        - name: country
          in: query
          description: Filter by country
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: Filter by role (Admin, Manager, Employee, Guest)
          required: false
          schema:
            type: string
            enum:
              - Admin
              - Manager
              - Employee
              - Guest
        - name: isActive
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Array of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
    post:
      summary: Create user
      operationId: createUser
      tags:
        - users
      # Admin-only operation with OAuth2 scopes
      security:
        - oauth2: ["users:write", "admin"]
      # Disable retry for non-idempotent POST
      x-retry-enabled: false
      # Disable caching for write operations
      x-cache-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Validation error
        '409':
          description: User with this email already exists
  /users/{userId}:
    # Inherit users policy
    x-ratelimit-policy: users
    x-retry-policy: users
    # HybridCache - specific policy for user detail with sliding expiration
    x-cache-type: hybrid
    x-cache-policy: user-detail
    x-cache-expiration-seconds: 600
    x-cache-sliding-expiration-seconds: 120
    x-cache-mode: hybrid
    x-cache-tags:
      - users
      - user-detail
    parameters:
      - name: userId
        in: path
        required: true
        description: The id of the user
        schema:
          type: string
          format: uuid
    get:
      summary: Get a specific user
      operationId: getUserById
      tags:
        - users
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '404':
          description: User not found
    put:
      summary: Update a specific user
      operationId: updateUserById
      tags:
        - users
      # Disable caching for write operations
      x-cache-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Validation error
        '404':
          description: User not found
        '409':
          description: Email already in use
    delete:
      summary: Delete a specific user
      operationId: deleteUserById
      tags:
        - users
      # Admin-only operation
      security:
        - oauth2: ["users:write", "admin"]
      # Stricter rate limit for deletes
      x-ratelimit-policy: users-delete
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      # Disable caching for write operations
      x-cache-enabled: false
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
