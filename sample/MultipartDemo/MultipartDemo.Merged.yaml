      name: filter
      in: query
      schema:
        type: string
    pageIndex:
      name: pageIndex
      in: query
      description: The number of items to skip before starting to collect the result set.
      schema:
        minimum: 0
        type: integer
        default: 0
    pageSize:
      name: pageSize
      in: query
      description: The numbers of items to return.
      schema:
        maximum: 100
        minimum: 1
        type: integer
        default: 10
