          minLength: 2
          type: string
          description: User's first name
        lastName:
          maxLength: 50
          minLength: 2
          type: string
          description: User's last name
        email:
          maxLength: 254
          type: string
          description: User's email address
          format: email
        phone:
          pattern: '^\+?[1-9]\d{6,14}$'
