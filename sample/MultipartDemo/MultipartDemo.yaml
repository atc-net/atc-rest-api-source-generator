openapi: "3.1.0"

# ============================================
# NULLABILITY - deliberately the OpenAPI 3.0 spelling
#
# This sample keeps `nullable: true` even though OpenAPI 3.1 removed the keyword in favour of
# `type: [string, "null"]`. That is on purpose: plenty of real 3.1 documents still carry the 3.0
# spelling, and the generator honours it either way, so this file is the sample that proves it.
#
# sample/Showcase (3.2) uses the modern `type: [x, "null"]` form, and sample/NexusSample (3.0)
# uses `nullable: true` where it is genuinely valid. Between them the three samples cover every
# combination.
#
# Do not "fix" this to the 3.1 form - it would remove the only coverage of the legacy spelling
# in a 3.1 document. A strict OpenAPI linter will flag it; that is the point.
# ============================================

info:
  version: 1.0.0
  title: My Demo API - Full
  description: This is a sample server for a demo api.
  license:
    name: MIT
servers:
  - url: http://demo.swagger.io/v1
  - url: http://demo/scalar/v1

# ============================================
# SECURITY - Global JWT authentication
# ============================================
security:
  - bearer_auth: []

# ============================================
# RATE LIMITING - Global API limits
# ============================================
x-ratelimit-policy: global
x-ratelimit-permit-limit: 1000
x-ratelimit-window-seconds: 60
x-ratelimit-algorithm: sliding

# ============================================
# RESILIENCE - Client-side retry defaults
# ============================================
x-retry-policy: standard
x-retry-max-attempts: 3
x-retry-delay-seconds: 1
x-retry-backoff: exponential
x-retry-use-jitter: true
x-retry-timeout-seconds: 30
x-retry-handle-429: true

# ============================================
# WEBHOOKS - OpenAPI 3.1 feature
# Defines event payloads sent to subscribers
# ============================================
webhooks:
  systemNotification:
    post:
      operationId: onSystemNotification
      summary: System notification webhook
      description: |
        Webhook triggered for system-wide notifications.
        Events are sent every 10 seconds with system metrics and alerts.
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemNotification'
      responses:
        '200':
          description: Notification acknowledged
        '202':
          description: Notification accepted for processing

  userActivity:
    post:
      operationId: onUserActivity
      summary: User activity webhook
      description: |
        Webhook triggered when user activity occurs (login, logout, profile update).
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActivityEvent'
      responses:
        '200':
          description: Event acknowledged

  dataChange:
    post:
      operationId: onDataChange
      summary: Data change webhook
      description: |
        Webhook triggered when data is created, updated, or deleted.
        Subscribers receive real-time updates about entity changes.
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataChangeEvent'
      responses:
        '200':
          description: Event acknowledged

paths: {}

components:
  schemas:
    # ============================================
    # WEBHOOK PAYLOADS - Event schemas
    # ============================================
    SystemNotification:
      title: SystemNotification
      type: object
      description: System-wide notification event
      required:
        - id
        - type
        - timestamp
        - message
      properties:
        id:
          type: string
          format: uuid
          description: Unique notification ID
        type:
          $ref: '#/components/schemas/NotificationType'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        message:
          type: string
          description: Human-readable notification message
        data:
          type: string
          description: Additional event-specific data as JSON string
          nullable: true
        metrics:
          $ref: '#/components/schemas/SystemMetrics'

    SystemMetrics:
      title: SystemMetrics
      type: object
      description: Real-time system metrics
      required: [cpuUsage, memoryUsage, activeConnections, requestsPerSecond, averageResponseTime, uptime]
      properties:
        cpuUsage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: CPU usage percentage
        memoryUsage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Memory usage percentage
        activeConnections:
          type: integer
          minimum: 0
          description: Number of active connections
        requestsPerSecond:
          type: number
          format: double
          minimum: 0
          description: Current requests per second
        averageResponseTime:
          type: number
          format: double
          minimum: 0
          description: Average response time in milliseconds
        uptime:
          type: string
          description: System uptime duration (e.g., "2d 5h 30m")

    UserActivityEvent:
      title: UserActivityEvent
      type: object
      description: User activity webhook payload
      required:
        - id
        - userId
        - action
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/UserAction'
        timestamp:
          type: string
          format: date-time
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        details:
          type: string
          description: Additional details as JSON string
          nullable: true

    UserAction:
      type: string
      enum:
        - Login
        - Logout
        - ProfileUpdate
        - PasswordChange
        - AccountCreated
        - AccountDeleted
      description: Type of user action

    DataChangeEvent:
      title: DataChangeEvent
      type: object
      description: Data change webhook payload
      required:
        - id
        - entityType
        - entityId
        - operation
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
          description: Type of entity (e.g., "User", "Account", "Task")
        entityId:
          type: string
          description: ID of the affected entity
        operation:
          $ref: '#/components/schemas/DataOperation'
        timestamp:
          type: string
          format: date-time
        performedBy:
          type: string
          format: uuid
          nullable: true
          description: User who performed the operation
        previousValue:
          type: string
          nullable: true
          description: Previous entity state as JSON string (for updates)
        newValue:
          type: string
          nullable: true
          description: New entity state as JSON string (for creates/updates)

    DataOperation:
      type: string
      enum:
        - Created
        - Updated
        - Deleted
      description: Type of data operation

    NotificationType:
      type: string
      enum:
        - System
        - User
        - Data
        - Alert
        - Metric
      description: Category of notification

    NotificationSeverity:
      type: string
      enum:
        - Info
        - Warning
        - Error
        - Critical
      description: Severity level of the notification

    # ============================================
    # SUBSCRIPTION MANAGEMENT
    # ============================================
    Subscription:
      title: Subscription
      type: object
      description: Notification subscription
      required:
        - id
        - topics
        - createdAt
        - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
          nullable: true
          description: Optional friendly name for the subscription
        topics:
          type: array
          items:
            $ref: '#/components/schemas/NotificationType'
          minItems: 1
          description: Event types to subscribe to
        callbackUrl:
          type: string
          format: uri
          nullable: true
          description: HTTP callback URL for webhook delivery (optional)
        connectionId:
          type: string
          nullable: true
          description: SignalR connection ID for real-time delivery
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration time
        lastNotificationAt:
          type: string
          format: date-time
          nullable: true

    Subscriptions:
      title: Subscriptions
      type: array
      items:
        $ref: '#/components/schemas/Subscription'

    CreateSubscriptionRequest:
      title: CreateSubscriptionRequest
      type: object
      required:
        - topics
      properties:
        name:
          type: string
          maxLength: 100
          nullable: true
        topics:
          type: array
          items:
            $ref: '#/components/schemas/NotificationType'
          minItems: 1
          description: Event types to subscribe to
        callbackUrl:
          type: string
          format: uri
          nullable: true
          description: HTTP callback URL (use for server-to-server webhooks)
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 43200
          nullable: true
          description: Subscription duration in minutes (max 30 days)

    NotificationEvent:
      title: NotificationEvent
      type: object
      description: Generic notification event for streaming
      required:
        - id
        - type
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          nullable: true
        payload:
          oneOf:
            - $ref: '#/components/schemas/SystemNotification'
            - $ref: '#/components/schemas/UserActivityEvent'
            - $ref: '#/components/schemas/DataChangeEvent'

    NotificationEvents:
      title: NotificationEvents
      type: array
      items:
        $ref: '#/components/schemas/NotificationEvent'

    # ============================================
    # EXISTING SCHEMAS
    # ============================================
    ExceptionTestResponse:
      title: ExceptionTestResponse
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: integer
          format: int32
          description: The exception code that was requested
        message:
          type: string
          description: Success message when no exception was thrown
        timestamp:
          type: string
          format: date-time
          description: When the request was processed
    Account:
      title: Account
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Accounts:
      title: Accounts
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Account"
    FileAsFormDataRequest:
      title: FileAsFormDataRequest
      type: object
      properties:
        itemName:
          type: string
        file:
          type: string
          format: binary
          nullable: true
        items:
          type: array
          items:
            type: string
      required:
        - itemName
        - items
    FilesAsFormDataRequest:
      title: FilesAsFormDataRequest
      type: object
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
      required:
        - files
    Task:
      title: Task
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Tasks:
      title: Tasks
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Task"
    User:
      title: User
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - dateOfBirth
        - role
        - address
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          description: User's first name
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          description: User's last name
        email:
          type: string
          format: email
          maxLength: 254
          description: User's email address
        phone:
          type: string
          pattern: '^\+?[1-9]\d{6,14}$'
          description: Phone number in E.164 format
          nullable: true
        website:
          type: string
          format: uri
          maxLength: 2048
          description: User's personal website
          nullable: true
        dateOfBirth:
          type: string
          format: date
          description: User's date of birth
        age:
          type: integer
          minimum: 0
          maximum: 150
          readOnly: true
          description: Calculated age based on date of birth
        bio:
          type: string
          maxLength: 1000
          description: Short biography
          nullable: true
        avatarUrl:
          type: string
          format: uri
          description: URL to user's avatar image
          nullable: true
        isActive:
          type: boolean
          default: true
          description: Whether the user account is active
        role:
          $ref: "#/components/schemas/UserRole"
        address:
          $ref: "#/components/schemas/Address"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the user was created
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the user was last updated
    CreateUserRequest:
      title: CreateUserRequest
      type: object
      required:
        - firstName
        - lastName
        - email
        - dateOfBirth
        - role
        - address
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: '^\+?[1-9]\d{6,14}$'
          nullable: true
        website:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        dateOfBirth:
          type: string
          format: date
        bio:
          type: string
          maxLength: 1000
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
          default: true
        role:
          $ref: "#/components/schemas/UserRole"
        address:
          $ref: "#/components/schemas/AddressRequest"
    UpdateUserRequest:
      title: UpdateUserRequest
      type: object
      required:
        - firstName
        - lastName
        - email
        - dateOfBirth
        - role
        - address
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: '^\+?[1-9]\d{6,14}$'
          nullable: true
        website:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        dateOfBirth:
          type: string
          format: date
        bio:
          type: string
          maxLength: 1000
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        address:
          $ref: "#/components/schemas/AddressRequest"
    Address:
      title: Address
      type: object
      required:
        - street
        - city
        - postalCode
        - country
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 200
          description: Street address
        city:
          type: string
          minLength: 1
          maxLength: 100
          description: City name
        state:
          type: string
          maxLength: 100
          description: State or region
          nullable: true
        postalCode:
          type: string
          minLength: 2
          maxLength: 20
          description: Postal/ZIP code
        country:
          type: string
          minLength: 2
          maxLength: 100
          description: Country name
        countryCode:
          type: string
          minLength: 2
          maxLength: 3
          pattern: '^[A-Z]{2,3}$'
          description: ISO 3166-1 country code
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Geographic latitude
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Geographic longitude
          nullable: true
    AddressRequest:
      title: AddressRequest
      type: object
      required:
        - street
        - city
        - postalCode
        - country
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          maxLength: 100
          nullable: true
        postalCode:
          type: string
          minLength: 2
          maxLength: 20
        country:
          type: string
          minLength: 2
          maxLength: 100
        countryCode:
          type: string
          minLength: 2
          maxLength: 3
          pattern: '^[A-Z]{2,3}$'
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
    UserRole:
      type: string
      enum:
        - Admin
        - Manager
        - Employee
        - Guest
      description: User's role in the system
    Users:
      title: Users
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/User"
    PaginatedResult:
      title: PaginatedResult
      type: object
      required: [pageSize, pageIndex, count, totalCount, results]
      properties:
        pageSize:
          type: integer
        pageIndex:
          type: integer
        queryString:
          type: string
          nullable: true
        continuation:
          type: string
          nullable: true
        count:
          type: integer
        totalCount:
          type: integer
        results:
          type: array
          items: {}
  parameters:
    continuation:
      name: continuation
      in: query
      required: false
      schema:
        type: string
        nullable: true
    filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
    pageIndex:
      name: pageIndex
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: The number of items to skip before starting to collect the result set.
    pageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: The numbers of items to return.
    queryString:
      name: queryString
      in: query
      required: false
      schema:
        type: string
        nullable: true
      description: Search query string.
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication
    oauth2:
      type: oauth2
      description: OAuth2 with Authorization Code flow
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            users:read: Read access to user data
            users:write: Write access to user data
            admin: Full administrative access
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication