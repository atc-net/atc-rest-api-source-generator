            D15 (Mixed production), D16 (Production with electrical energy
            storage facilities),

            D17 (Power-to-X), D18 (Regenerative demand facility), D19 (Internal
            combustion engine diesel engine),

            D20 (Biocombustion engine), D99 (Unknown technology).
          nullable: true
        mpAddressWashInstructions:
          type: string
          description: >-
            Specifies if the address can be washed against the public Danish
