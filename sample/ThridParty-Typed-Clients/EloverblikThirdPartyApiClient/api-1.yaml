    MeteringPointDetailsDto:
      type: object
      properties:
        meteringPointId:
          type: string
          description: Unique metering point id consisting of 18 characters
          nullable: true
        parentMeteringPointId:
          type: string
          description: The id of the related parent metering point. Only applicable for
            child metering points
          nullable: true
        typeOfMP:
          type: string
          description: >-
            Specifies the type of metering point.
                        
            Possible values:
                        
            D01 (VE Production), D02 (Analysis), D04 (Surplus production group
            6), D05 (Net production),

            D06 (Supply to grid), D07 (Consumption from grid), D08 (Wholesale
            services), D09 (Own production),

            D10 (Net from grid), D11 (Net to grid), D12 (Total consumption), D14
            (Electrical heating),

            D15 (Net consumption), D17 (Other consumption), D18 (Other
            production), D19 (Capacity Settlement), D99 (Internal use),

            E17 (Consumption measurement point), E18 (Production measurement
            point).
          nullable: true
        energyTimeSeriesMeasureUnit:
          type: string
          description: >-
            Specifies the energy measurement unit relevant for the metering
            point.
                        
            Possible values:
                        
            AMP (Ampere), H87 (Count/Quantity), K3 (kVArh - KiloVolt-Ampere
            reactive hour),

            KWH (kWh - Kilowatt-hour), KWT (kW - Kilowatt), MAW (MW - Megawatt),

            MWH (MWh - Megawatt-hour), TNE (Tonne - metric ton), Z03 (MVAr -
            MegaVolt-Ampere reactive power),

            Z14 (Danish Tariff Code).
          nullable: true
        estimatedAnnualVolume:
          type: string
          description: |-
            Estimated annual consumption/production of the metering
            point. Only required for profiled settled metering points. May
            exist for metering points with other settlement methods, but is
            not necessarily maintained and should therefore not be used.
          nullable: true
        settlementMethod:
          type: string
          description: >-
            Settlement method of the metering point.
                        
            Possible values:
                        
            D01 (Flex settled), E01 (Profiled settled), E02 (Non-profiled
            settled).
                        
            If a metering point is flex settled or non-profiled settled or has

            no settlement method, only non-profiled energy quantities are

            registered for the metering point.

            If a metering point is profiled settled, profiled energy quantities

            (consumption statements) as well as non-profiled energy quantities
            can be registered for the metering point depending on

            the meter reading occurrence (see further details in the section

            regarding meterReadingOccurrence elsewhere in this table).

            Profiled settled metering points no longer exist, since all profiled
            settled metering points were converted to flex settled metering
            points before 01-01-2021.

            However, if a metering point used to be profiled settled, profiled
            energy quantities will still

            be registered for the metering point in the period when the

            metering point was profiled settled.
          nullable: true
        meterNumber:
          type: string
          description: Meter number identifying the physical meter. Only available if the
            metering point has a physical meter.
          nullable: true
        gridOperatorName:
          type: string
          description: Name of the grid operator
          nullable: true
        meteringGridAreaIdentification:
          type: string
          description: Id of the grid area to which the metering point belongs.
          nullable: true
        netSettlementGroup:
          type: string
          description: >-
            Net settlement group to which the metering point belongs.
                        
            Possible values:
                        
            0 (No Net Settlement), 1 (Net Settlement Group 1), 2 (Net Settlement
            Group 2),

            3 (Net Settlement Group 3), 4 (Net Settlement Group 4), 5 (Net
            Settlement Group 5),

            6 (Net Settlement Group 6), 7 (Net Settlement Group 7), 99 (Net
            Settlement Group 99).
          nullable: true
        physicalStatusOfMP:
          type: string
          description: |-
            Physical status of the metering point.
                        
            Possible values:
                        
            D03 (New), E22 (Connected), E23 (Disconnected).
          nullable: true
        consumerCategory:
          type: string
          description: Applies to all consumption metering points. Specifies the
            threedigit consumer category for the electricityconsumption category
            which applies to the metering point.
          nullable: true
        powerLimitKW:
          type: string
          description: Specifies the actual maximum limit for power (in kW).
          nullable: true
        powerLimitKWDecimal:
          type: number
          description: Specifies the actual maximum limit for power (in kW) in decimal.
          format: double
          nullable: true
        powerLimitA:
          type: string
          description: Specifies the actual maximum limit for current (in ampere)
          nullable: true
        subTypeOfMP:
          type: string
          description: |-
            Specifies the sub type of the metering point.
                        
            Possibles values:
                        
            D01 (Physical - metering point has a physical meter),
            D02 (Virtual - energy volume calculated by grid operator),
            D03 (Calculated - energy volume calculated in DataHub).
          nullable: true
        productionObligation:
          type: string
          description: Specifies for a production metering point that a production
            obligation applies to the metering point and that no change of
            supplier or move-in/move-out can be carried out for the metering
            point.
          nullable: true
        mpCapacity:
          type: string
          description: Specifies the power in kW for the production facility.
          nullable: true
        mpConnectionType:
          type: string
          description: >-
            Specifies the connection type of a metering point for which net
            settlement is used.
                        
            Possible values:
                        
            D01 (Direct connected), D02 (Installation connected).
          nullable: true
        disconnectionType:
          type: string
          description: >-
            Specifies how the metering point can be disconnected by the grid
            operator.
                        
            Possible values:
                        
            D00 (For future usage), D01 (Remote disconnection), D02 (Manual
            disconnection).
          nullable: true
        product:
          type: string
          description: >-
            Product Id.
                        
            Possible values:
                        
            Item5790001330590 (Tariff), Item5790001330606 (Fuel quantity),
            Item8716867000016 (Active power),

            Item8716867000023 (Reactive power), Item8716867000030 (Active
            energy), Item8716867000047 (Reactive energy).
          nullable: true
        consumerCVR:
          type: string
          description: CVR number of the registered consumer. Only available for metering
            points registered to business consumers.
          nullable: true
        dataAccessCVR:
          type: string
          description: Additional CVR number of the registered consumer. Only available
            for metering points registered to business consumers.
          nullable: true
        consumerStartDate:
          type: string
          description: Date when the current consumer was registered to the metering
            point. Not available for child metering points. The date is
            expressed in UTC as specified in ISO 8601.
          nullable: true
        meterReadingOccurrence:
          type: string
          description: >-
            Specifies the meter reading resolution.
                        
            Possibles values:
                        
            ANDET (Other), P1M (Monthly), PT15M (15 Minutes), PT1H (Hourly).
                        
            If a metering point has meter reading occurrence = Other, only

            profiled energy quantities (consumption statements) can be

            registered for the metering point.

            If a metering point has meter reading occurrence = P1M or

            PT15M, only non-profiled energy quantities can be registered

            for the metering point.

            If a metering point has meter reading occurrence = PT1H, profiled
            energy quantities (consumption statements) as well as

            non-profiled energy quantities can be registered for the metering
            point depending on the settlement method (see further details
            elsewhere in this table).

            See further details regarding profiled energy quantities versus

            non-profiled energy quantities in the sec
          nullable: true
        mpReadingCharacteristics:
          type: string
          description: >-
            Specifies how the metering point is read. Only applicable for
            profiled metering points.
                        
            Possible values:
                        
            D01 (Automatic meter reading), D02 (Manual meter reading).
          nullable: true
        meterCounterDigits:
          type: string
          description: Number of digits on the counting mechanism of a meter. Only
            applicable for metering points with a physical meter.
          nullable: true
        meterCounterMultiplyFactor:
          type: string
          description: The conversion factor on the counting mechanism of the meter. Only
            applicable for metering points with a physical meter.
          nullable: true
        meterCounterUnit:
          type: string
          description: |-
            Unit in which the counting mechanism of a meter meters the
            energy consumption. Only applicable for metering points with a
            physical meter.
          nullable: true
        meterCounterType:
          type: string
          description: >-
            Specifies whether the counter of a meter accumulates or balances
            consumption. Only applicable for metering points with a physical
            meter.
                        
            Possible values:
                        
            D01 (Accumulated), D02 (Balanced).
          nullable: true
        taxReduction:
          type: string
          description: Specifies whether the consumer is entitled to a potential
            electricity tax reduction due to electric heating.
          nullable: true
        taxSettlementDate:
          type: string
          description: |-
            The date specifies either the commencement or termination of
            an electricity tax reduction. The date is expressed in UTC as
            specified in ISO 8601.
          nullable: true
        mpRelationType:
          type: string
          description: Not used. No value is retuned. Will be removed in a later version
            of the API.
          nullable: true
        firstConsumerPartyName:
          type: string
          description: Name of consumer 1
          nullable: true
        secondConsumerPartyName:
          type: string
          description: Name of consumer 2
          nullable: true
        occurrence:
          type: string
          description: Date of the data request.
          nullable: true
        meteringPointAlias:
          type: string
          nullable: true
        gridOperatorID:
          type: string
          description: Id of the Grid Operator.
          nullable: true
        gridOperatorID_SchemeAgencyIdentifier:
          type: string
          description: >-
            Specifies which Agency the Balance supplier Identifier is associated
            with.
                        
            Possible values:
                        
            GLN: Global Location Number
            (https://www.gs1.org/standards/id-keys/gln)
                        
            EIC: The Energy Identification Coding
            (https://www.entsoe.eu/data/energy-identification-codes-eic/)
          nullable: true
        assetType:
          type: string
          description: >-
            Energy type.
                        
            Possible values:
                        
            D01 (Steam backpressure turbine), D02 (Gas turbine), D03 (Combined
            cycle),

            D04 (Internal combustion engine Gas), D05 (Steam turbine
            condensation/steam), D06 (Boiler),

            D07 (Stirling engine), D08 (Permanently connected electrical energy
            storage facilities),

            D09 (Temporarily connected electrical energy storage facilities),
            D10 (Fuel cells),

            D11 (Photovoltaics), D12 (Wind turbines), D13 (Hydropower), D14
