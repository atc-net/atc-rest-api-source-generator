            Possible values:
                        
            D01 (Washable), D02 (Not washable).
          nullable: true
        darReference:
          type: string
          description: Specifies the reference id to the public Danish Address Register.
          nullable: true
        streetCode:
          type: string
          description: Street code – part of metering point location address.
          nullable: true
        streetName:
          type: string
          description: Street name – part of metering point location address
          nullable: true
        buildingNumber:
