  version: V1.0
paths:
  /thirdpartyapi/api/authorization/authorization/meteringpoints/{scope}/{identifier}:
    get:
      tags:
        - Authorization
      summary: Get metering points
      description: >-
        This request is used for retrieving a list of metering points for which
        access has been granted.

        A filter value must be supplied to limit the result.
                    
        The following filter options are available:
                    
        `authorizationId`: Returns a list of metering points included in a
        specific customer authorization.
                    
        `customerCVR`: Returns a list of metering points for which access has
        been granted by a specific customer
          (based on the CVR of the customer/granting party).

                    
        `customerKey`: Returns a list of metering points linked to a specific
        customer key.
          The customer key can be supplied by the third party during the process of granting data access.
      parameters:
        - name: scope
          in: path
          description: "Define what kind of authorization id to filter on. Possible values
            are: 'authorizationId', 'customerCVR', 'customerKey'"
          required: true
          schema:
            type: string
        - name: identifier
          in: path
          description: Identification key
          required: true
          schema:
            type: string
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeteringPointThirdPartyDtoListApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/MeteringPointThirdPartyDtoListApiResponse"
        "401":
          description: When the provided token doesn't meet the requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /thirdpartyapi/api/authorization/authorization/meteringpointids/{scope}/{identifier}:
    get:
      tags:
        - Authorization
      summary: Get metering point ids
      description: >-
        This request is used for retrieving a list of metering point IDs for
        which access has been granted.

        A filter value must be supplied to limit the result.
                    
        The following filter options are available:

        `authorizationId`: Returns a list of metering point IDs included in a
        specific customer authorization.
                    
        `customerCVR`: Returns a list of metering point IDs for which access has
        been granted by a specific customer
          (based on the CVR of the customer/granting party).

                    
        `customerKey`: Returns a list of metering point IDs linked to a specific
        customer key.
          The customer key can be supplied by the third party during the process of granting access.
      parameters:
        - name: scope
          in: path
          description: "Define what kind of authorization id to filter on. Possible values
            are: 'authorizationId', 'customerCVR', 'customerKey'"
          required: true
          schema:
            type: string
        - name: identifier
          in: path
          description: Identification key
          required: true
          schema:
            type: string
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringListApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/StringListApiResponse"
        "401":
          description: When the provided token doesn't meet the requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /thirdpartyapi/api/authorization/authorizations:
    get:
      tags:
        - Authorization
      summary: Get authorizations
      description: >-
        This request is used for retrieving details about authorizations (powers
        of attorney) granted by customers.
                    
        Only data regarding valid or active authorizations is returned.

        Data related to deleted or expired authorizations is not included in the
        response.
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDtoListApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthorizationDtoListApiResponse"
        "401":
          description: When the provided token dont meet the requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /thirdpartyapi/api/isalive:
    get:
      tags:
        - IsAlive
      summary: Get IsAlive status
      description: >-
        Call this endpoint to verify whether we are currently operating
        normally.
                    
        If we are experiencing more traffic than we can handle, this endpoint
        may return HTTP 503.

        The status currently refreshes every 60 seconds.
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
            application/xml:
              schema:
                type: boolean
            text/xml:
              schema:
                type: boolean
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Service Unavailable
  /thirdpartyapi/api/meterdata/gettimeseries/{dateFrom}/{dateTo}/{aggregation}:
    post:
      tags:
        - MeterData
      summary: Get timeseries
      description: >-
        This request is used for querying time series data for one or more
        metering points

        for which access has been granted, for a specified period and with a
        specified aggregation level.
                    
        Please note that it is only possible to retrieve time series data for
        the previous five years plus the current year.
      parameters:
        - name: dateFrom
          in: path
          description: "Date from filter in format: 'YYYY-MM-DD'"
          required: true
          schema:
            type: string
        - name: dateTo
          in: path
          description: "Date to filter in format: 'YYYY-MM-DD'"
          required: true
          schema:
            type: string
        - name: aggregation
          in: path
          description: "Time aggregation. Possible values are: 'Actual', 'Quarter',
            'Hour', 'Day', 'Month', 'Year'"
          required: true
          schema:
            type: string
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      requestBody:
        description: List of metering point ids.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeteringPointsRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/MeteringPointsRequest"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyEnergyDataMarketDocumentResponseListApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/MyEnergyDataMarketDocumentResponseListApiResponse"
        "401":
          description: If you do not have access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /thirdpartyapi/api/meteringpoint/getdetails:
    post:
      tags:
        - MeteringPoint
      summary: Get metering point details
      description: This request is used for querying details (master data) for one or
        more metering points (for which access has been granted).
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeteringPointsRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/MeteringPointsRequest"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeteringPointDetailsDtoResponseListApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/MeteringPointDetailsDtoResponseListApiResponse"
        "401":
          description: If you do not have access to one or more of the listed metering
            point id(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /thirdpartyapi/api/meteringpoint/getcharges:
    post:
      tags:
        - MeteringPoint
      summary: Get charges
      description: >-
        This request is used for querying charge data—such as subscriptions and
        tariffs—for one or more metering points

        for which access has been granted.
                    
        Charges linked to the metering point at the time of the request or on
        any future date will be returned.
                    
        However, past and future changes to an existing charge are not included
        in the response.
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeteringPointsRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/MeteringPointsRequest"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeteringPointChargesDtoResponseListApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/MeteringPointChargesDtoResponseListApiResponse"
        "401":
          description: If you do not have access to one or more of the listed metering
            point id(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /thirdpartyapi/api/meteringpoint/getchargelinkswithcharges:
    post:
      tags:
        - MeteringPoint
      summary: Get charge links with charges
      description: >-
        This request is used for querying charge links, charge information, and
        charge series for one or more

        metering points and date intervals for which access has been granted.
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetChargeLinksWithChargesRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/GetChargeLinksWithChargesRequest"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChargeLinksWithChargesResponseApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/GetChargeLinksWithChargesResponseApiResponse"
        "401":
          description: If you do not have access to one or more of the listed metering
            point id(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: When the Charges integration feature is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /thirdpartyapi/api/token:
    get:
      tags:
        - Token
      summary: Get data access token
      description: >-
        In order to get an access token you will need

        a valid refresh token. This token can be fetched from the portal.

        The token is a JWT token. There are tools that can read the content eg:
        https://jwt.io/

        The token must be submittet in the request header like "Authorization:
        Bearer eyJhbGciOi..."
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
            default: "1.0"
      responses:
        "200":
          description: When successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/StringApiResponse"
        "401":
          description: When the provided token don't meet the requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: When a non-refresh token is used
          content:
            application/json:
              schema:
