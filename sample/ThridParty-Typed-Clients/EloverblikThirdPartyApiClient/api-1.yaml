openapi: 3.0.4
info:
  title: Eloverblik.Api.ThirdPartyApi
  description: >-
    
    <p>
        This API enables third parties to access customers' data from DataHub based on authorization (power of attorney) granted by the customer. To gain access to the API the third party must:
    <p/>


    <ul style="list-style-type:disc;">
        <li>Be registered as a third party to DataHub.</li>
        <li>Be authorized by use of a token</li>
    </ul>


    <p>
        You can apply for becoming a third party participant here:
        <a href="https://en.energinet.dk/electricity/new-player/how-to-become-a-third-party/">
            https://en.energinet.dk/electricity/new-player/how-to-become-a-third-party/
        </a>
        / Link to danish version:
        <a href="https://energinet.dk/el/elmarkedet/sadan-bliver-du-tredjepart/">
            https://energinet.dk/el/elmarkedet/sadan-bliver-du-tredjepart/
        </a>
    <p/>


    <p>
        Authentication and authorization are handled by using bearer tokens.
        To get started you need a refresh token. You can generate a refresh token in the ElOverblik portal after logging in with MitID as a registered third party. The token is a long text string (JWT token), which must be copied and stored for use with the system that needs to access the API.
        When you have obtained a refresh token, you can access the token endpoint to create a short-lived data access token (valid for 24 hours)
        The data access token allows you to access the rest of the endpoints below.
    </p>


    <p>
        This API only gives you access to data from active authorizations (powers of attorneys) granted by customers. Data regarding deleted or expired authorizations are not returned.
    </p>


    <p>
        When requesting user authorizations (powers of attorney) from a third-party application via ElOverblik.dk using a "Power of Attorney" link, it is recommended to follow the technical reference guide for MitID Integration provided by the Signaturgruppen Broker:
        <a href="https://signaturgruppen-a-s.github.io/signaturgruppen-broker-documentation/idps/app-mitid-integration.html">https://signaturgruppen-a-s.github.io/signaturgruppen-broker-documentation/idps/app-mitid-integration.html
        </a>
    </p>


    <p>
        It is possible to set a correlation id in the request header using the 'X-User-Correlation-ID' (with an UUID). When provided this id will follow the request and finally end in the response header. This id can be used for tracking the request. Parallel to this id there is another internally id (Also a UUID), which also is returned in the response header as 'X-Correlation-ID'.
    <p/>


    <p>Please be aware that it is only possible to get time series data for the
    previous 5 years + current year.</p>


    <b><p>Please note: Submission of meter readings to DataHub is no longer
    mandatory since end of 2021. Therefore, data may not be available for all
    metering points.</p></b>


    <h3>1. Limitations</h3>

    <p>At times, we may experience higher loads than our underlying data
    provider, DataHub, can handle. Therefore we have enforced some limitations
    on the usage of this API:</p>


    <ul style="list-style-type:disc;">
        <li>Calls to GetToken are restricted to 2 per minute per IP address.</li>
        <li>The total number of calls per IP address is restricted to 120 per minute.</li>
        <li>The total number of calls for <b>all</b> users is restricted to 1200 per minute.</li>
    </ul>


    <p>If you exceed any one of these limits, you will get an http error 429 -
    Too many requests.</br>

    If DataHub is not able to keep up with the demand - even if the above limits
    are not exceeded - you may get an http error 503 - DataHub unavailable.</p>


    <h3>2. Usage recommendations</h3>

    <ul style="list-style-type:disc;">
        <li>Bundle requests for 10 metering points at a time.</li>
        <li>Spread out multiple requests over a longer period.</li>
        <li>Don't request data for periods of several years repeatedly.</li>
        <li>If you get an error 429 or 503, wait 1min. before retrying.</li>
        <li>If you get an error, then try to reduce the amount of metering points or reduce the date period of the request.</li>
        <li>The data access token is active for 24h and should not need to be refreshed more than once a day.</li>
        <li>If you get an error or timeout on the /thirdpartyapi/api/authorization/authorization/meteringpoints/ then try to switch to /thirdpartyapi/api/authorization/authorization/meteringpointids/ and then split the meteringpoints into smaller bundles before requesting /thirdpartyapi/api/meteringpoint/getdetails</li>
    </ul>


    <h3>3. Possible system error codes</h3>


    <h4>General Error Codes</h4>


    <table>
        <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>10000</td>
                <td>NoError</td>
                <td>No error – the operation was successful.</td>
            </tr>
            <tr>
                <td>10001</td>
                <td>WrongNumberOfArguments</td>
                <td>The number of arguments is incorrect.</td>
            </tr>
        </tbody>
    </table>


