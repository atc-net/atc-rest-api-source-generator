openapi: "3.2.0"
info:
  version: 1.0.0
  title: HTTP Methods Test
  description: OpenAPI 3.2 query method, additionalOperations (custom verbs), HEAD, OPTIONS and TRACE end-to-end

paths:
  /resources:
    get:
      operationId: listResources
      summary: List resources
      tags:
        - resources
      responses:
        "200":
          description: A list of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    query:
      operationId: queryResources
      summary: Query resources with a body
      tags:
        - resources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceQuery"
      responses:
        "200":
          description: Matching resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    head:
      operationId: probeResources
      summary: Probe the resources (a HEAD that declares the content of its GET - an answer to a HEAD has no body)
      tags:
        - resources
      responses:
        "200":
          description: The headers the list would have
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    options:
      operationId: describeResources
      summary: What the collection allows
      tags:
        - resources
      responses:
        "204":
          description: The methods the collection allows
          headers:
            Allow:
              schema:
                type: string
    trace:
      operationId: traceResources
      summary: The request as the server received it
      tags:
        - resources
      responses:
        "200":
          description: The request, echoed
          content:
            message/http:
              schema:
                type: string
    additionalOperations:
      LINK:
        operationId: linkResource
        summary: Link a resource (custom verb)
        tags:
          - resources
        responses:
          "204":
            description: Linked

components:
  schemas:
    Resource:
      type: object
      title: Resource
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ResourceQuery:
      type: object
      title: ResourceQuery
      properties:
        filter:
          type: string
