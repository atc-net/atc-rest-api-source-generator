openapi: 3.1.0
info:
  title: Contoso Orders
  version: 1.0.0
  description: >-
    A multi-part specification (the base file and OverlaysMultiPart_Orders.yaml) with an overlay. The overlay sees the
    merged document, so it patches the operations the part file contributes.
paths: {}
components:
  schemas:
    Order:
      title: Order
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        total:
          type: number
          format: double
