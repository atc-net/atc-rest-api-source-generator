openapi: 3.0.3
info:
  title: Non-JSON Content Test API
  version: 1.0.0
  description: Tests non-JSON request and response content types

paths:
  /reports/text:
    get:
      operationId: getTextReport
      summary: Get a plain text report
      responses:
        '200':
          description: Plain text report
          content:
            text/plain:
              schema:
                type: string

  /files/{fileId}:
    get:
      operationId: downloadFile
      summary: Download a binary file (the C# clients hand over the open stream)
      x-return-stream: true
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  /exports/csv:
    get:
      operationId: exportCsv
      summary: Export data as CSV
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string

  /items:
    get:
      operationId: listItems
      summary: List items as JSON
      responses:
        '200':
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'

  /items/{itemId}/sheet:
    get:
      operationId: getItemSheet
      summary: Get an item as JSON, or its PDF sheet
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The item, or its PDF sheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Item not found

  /items/{itemId}/attachment:
    put:
      operationId: updateItemAttachment
      summary: Replace an item's attachment with a raw file
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Replaced

  /items/{itemId}/photo:
    patch:
      operationId: updateItemPhoto
      summary: Update an item's photo and its caption
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemPhoto'
      responses:
        '204':
          description: Updated

  /items/{itemId}:
    patch:
      operationId: patchItem
      summary: Update an item with a JSON merge patch
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '204':
          description: Updated

components:
  schemas:
    Item:
      title: Item
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ItemPhoto:
      title: ItemPhoto
      type: object
      properties:
        caption:
          type: string
        photo:
          type: string
          format: binary
