openapi: 3.1.1
info:
  version: 1.0.0
  title: JSON Lines Test
  description: >
    JSON Lines (application/jsonl and its aliases) and JSON Text Sequences (application/json-seq) in both directions:
    streamed request bodies (an import), streamed responses declared by the media type alone (no
    x-return-async-enumerable), a body that is a stream in and a stream out, a body offered as JSON Lines or a JSON
    array, an optional streamed body, and a webhook whose payload is JSON Lines.

paths:
  /readings/export:
    get:
      operationId: listReadings
      summary: Export readings as NDJSON
      tags:
        - readings
      responses:
        '200':
          description: The readings, one per line
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Reading'
  /readings/export-seq:
    get:
      operationId: listReadingSequence
      summary: Export readings as a JSON text sequence
      tags:
        - readings
      responses:
        '200':
          description: The readings, one per record
          content:
            application/json-seq:
              schema:
                $ref: '#/components/schemas/Reading'
  /readings/import:
    post:
      operationId: importReadings
      summary: Import readings sent as JSON Lines
      tags:
        - readings
      requestBody:
        required: true
        content:
          application/jsonl:
            schema:
              $ref: '#/components/schemas/Reading'
      responses:
        '202':
          description: The readings were imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSummary'
        '400':
          description: A record is not valid
  /readings/import-seq:
    post:
      operationId: importReadingSequence
      summary: Import between 1 and 1000 readings sent as a JSON text sequence
      tags:
        - readings
      requestBody:
        required: true
        content:
          application/json-seq:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                $ref: '#/components/schemas/Reading'
      responses:
        '202':
          description: The readings were imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSummary'
  /readings/import-either:
    post:
      operationId: importReadingsAnyFormat
      summary: Import readings sent as JSON Lines or as a JSON array
      tags:
        - readings
      requestBody:
        required: true
        content:
          application/jsonl:
            schema:
              $ref: '#/components/schemas/Reading'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Reading'
      responses:
        '202':
          description: The readings were imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSummary'
  /readings/import-optional:
    put:
      operationId: updateReadings
      summary: Replace the readings with the ones sent (none clears them)
      tags:
        - readings
      requestBody:
        required: false
        content:
          application/x-ndjson:
            schema:
              $ref: '#/components/schemas/Reading'
      responses:
        '204':
          description: The readings were replaced
  /readings/search:
    post:
      operationId: searchReadings
      summary: The readings of one device - a form in, NDJSON out
      tags:
        - readings
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReadingQuery'
      responses:
        '200':
          description: The readings of the device, one per line
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Reading'
  /readings/normalize:
    post:
      operationId: normalizeReadings
      summary: Normalize readings - a stream in, a stream out
      tags:
        - readings
      requestBody:
        required: true
        content:
          application/jsonl:
            schema:
              $ref: '#/components/schemas/Reading'
      responses:
        '200':
          description: The normalized readings, one per line
          content:
            application/jsonl:
              schema:
                $ref: '#/components/schemas/Reading'

webhooks:
  readingsArrived:
    post:
      operationId: onReadingsArrived
      summary: Readings pushed by a device gateway, as JSON Lines
      requestBody:
        required: true
        content:
          application/jsonl:
            schema:
              $ref: '#/components/schemas/Reading'
      responses:
        '200':
          description: The readings were received

components:
  schemas:
    Reading:
      title: Reading
      type: object
      required:
        - deviceId
        - value
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
        value:
          type: number
          format: double
          minimum: -100
          maximum: 100
        takenAt:
          type: string
          format: date-time
    ReadingQuery:
      title: ReadingQuery
      type: object
      required:
        - deviceId
      properties:
        deviceId:
          type: string
    ImportSummary:
      title: ImportSummary
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: integer
          format: int32
