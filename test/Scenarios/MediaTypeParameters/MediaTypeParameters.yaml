openapi: 3.0.3
info:
  title: Media Type Parameters
  description: Media types the way real specifications write them - with parameters, in another case, as wildcards - which name the same bodies as the plain ones.
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      summary: A JSON response declared with a charset parameter.
      responses:
        '200':
          description: The pets.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: A JSON request body declared in another case, and a response declared under a wildcard.
      requestBody:
        required: true
        content:
          Application/JSON:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{id}:
    get:
      operationId: getPet
      summary: A response declared under application/* (springdoc's default).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The pet.
          content:
            application/*:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Not found.
          content:
            application/problem+json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pets/{id}/photo:
    get:
      operationId: getPhoto
      summary: A wildcard with a binary schema stays a file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The photo.
          content:
            '*/*':
              schema:
                type: string
                format: binary
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
