name: "Build and test"

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  dotnet-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 📐 Ensure nuget.org added as package source on Windows
        if: matrix.os == 'windows-latest'
        run: |
          if (-not (dotnet nuget list source | Select-String -Pattern "nuget.org")) {
            dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
          }
        shell: pwsh

      - name: 🔁 Restore packages
        run: dotnet restore Atc.Rest.Api.SourceGenerator.slnx

      - name: 🛠️ Build solution
        run: dotnet build Atc.Rest.Api.SourceGenerator.slnx -c Release --no-restore

  dotnet-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: dotnet-build
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'

      - name: 📐 Ensure nuget.org added as package source on Windows
        if: matrix.os == 'windows-latest'
        run: |
          if (-not (dotnet nuget list source | Select-String -Pattern "nuget.org")) {
            dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
          }
        shell: pwsh

      - name: 🔁 Restore packages
        run: dotnet restore Atc.Rest.Api.SourceGenerator.slnx

      - name: 🛠️ Build solution
        run: dotnet build Atc.Rest.Api.SourceGenerator.slnx -c Release --no-restore /p:UseSourceLink=true

      # Every test project, the Integration category included (it owns the *.verified.ts snapshots and the scenario
      # validation); a project that runs no test fails the step.
      - name: 🧪 Run tests with coverage
        run: dotnet test --solution Atc.Rest.Api.SourceGenerator.slnx -c Release --no-build --coverage --coverage-output-format cobertura --report-trx

      - name: 📤 Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.cobertura.xml
          if-no-files-found: error

  playwright:
    # Playwright installs Chromium only on the Ubuntu releases it supports; ubuntu-latest moved past them
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: dotnet-build
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'

      - name: 🛠️ Build the Showcase API and Blazor app
        run: |
          dotnet build sample/Showcase/Showcase.Api/Showcase.Api.csproj
          dotnet build sample/Showcase/Showcase.BlazorApp/Showcase.BlazorApp.csproj

      - name: 📦 Install the React apps and the test project
        run: |
          npm ci --prefix sample/Showcase/Showcase.ReactApp.Fetch
          npm ci --prefix sample/Showcase/Showcase.ReactApp.Axios
          npm ci --prefix test/Showcase.E2ETests
          npx --prefix test/Showcase.E2ETests playwright install --with-deps chromium

      - name: 🎭 Run the Playwright tests
        working-directory: test/Showcase.E2ETests
        run: npx playwright test

      - name: 📤 Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            test/Showcase.E2ETests/playwright-report
            test/Showcase.E2ETests/test-results
          if-no-files-found: warn

  # The test-suite report: the five runtime matrices, the compile gate over every scenario, the diagnostics coverage,
  # the Playwright run of the Showcase apps and the changes since the previous run - published as an artifact of every
  # run (the committed docs/test-suite-report.* files are regenerated by hand before a release). It runs after the
  # Playwright job, whose results it reads from test/Showcase.E2ETests/test-results/results.json.
  test-suite-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [dotnet-test, playwright]
    if: always()
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'

      - name: 📥 Download the Playwright results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: playwright-report
          path: test/Showcase.E2ETests

      - name: 🛠️ Build solution
        run: dotnet build Atc.Rest.Api.SourceGenerator.slnx -c Release

      - name: 📊 Write the test-suite report
        run: dotnet test --project test/Atc.Rest.Api.SourceGenerator.Tests -c Release --no-build -- --filter-method "*Report_EndToEndErrorBodyMatrix" --explicit only

      # The committed report is the page the README links to: a warning when this run's verdicts or summary differ
      - name: 🔎 Compare with the committed test-suite report
        if: always() && hashFiles('docs/test-suite-report.json') != ''
        shell: bash
        run: |
          git show HEAD:docs/test-suite-report.json > "$RUNNER_TEMP/committed-test-suite-report.json"
          node .github/scripts/compare-test-suite-report.mjs "$RUNNER_TEMP/committed-test-suite-report.json" docs/test-suite-report.json

      - name: 📤 Upload the test-suite report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-suite-report
          path: |
            docs/test-suite-report.html
            docs/test-suite-report.json
            docs/test-suite-report.history.jsonl
          if-no-files-found: error

  smoke-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: dotnet-test
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 📐 Ensure nuget.org added as package source on Windows
        if: matrix.os == 'windows-latest'
        run: |
          if (-not (dotnet nuget list source | Select-String -Pattern "nuget.org")) {
            dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
          }
        shell: pwsh

      - name: 🔁 Restore packages
        run: dotnet restore Atc.Rest.Api.SourceGenerator.slnx

      - name: 🛠️ Build solution
        run: dotnet build Atc.Rest.Api.SourceGenerator.slnx -c Release --no-restore

      - name: 🛠️ Build PetStoreSimple sample
        run: dotnet build sample/PetStoreSimple/PetStoreSimple.Api/PetStoreSimple.Api.csproj -c Release

      - name: 🛠️ Build MultipartDemo sample
        run: dotnet build sample/MultipartDemo/MultipartDemo.Api/MultipartDemo.Api.csproj -c Release
