name: "🏷️ Commit messages"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # release-please builds the changelog from every commit (a pull request is rebase-merged), and drops a type it
      # does not know: each commit names a Conventional Commits type - one of release-please-config.json's sections,
      # or test / chore / ci / build / style, which the changelog leaves out on purpose
      - name: 🔎 Check the commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Commits already on a pushed branch before this check existed
          grandfathered="11eb3831c7020344868bbe64dbf65a3c898dedb4"
          pattern='^(feat|fix|perf|refactor|docs|revert|test|chore|ci|build|style)(\([a-z0-9 ,./-]+\))?!?: .+'
          bad=0
          while read -r sha subject; do
            if [[ " $grandfathered " == *" $sha "* ]]; then
              continue
            fi
            if ! [[ "$subject" =~ $pattern ]]; then
              echo "::error::$sha: '$subject' is not a Conventional Commits message with a known type"
              bad=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE_SHA..$HEAD_SHA")
          exit $bad
